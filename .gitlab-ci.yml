stages:
  - build
  - test

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/

build-job:
  stage: build
  script:
    - .\gradlew.bat clean assemble
  artifacts:
    paths:
      - build/libs/*.jar

test-job:
  stage: test
  script:
    - .\gradlew.bat test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/**/TEST-*.xml
