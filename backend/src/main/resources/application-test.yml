spring:
  application:
    name: carryporter
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      # Testcontainers @ServiceConnection이 자동으로 설정

mqtt:
  broker:
    # IntegrationTestSupport의 DynamicPropertySource가 동적으로 설정
    url: tcp://${MQTT_HOST:localhost}:${MQTT_PORT:1883}
    username:
    password:
  client:
    id: carryporter-test-client

